spring.datasource.url=jdbc:h2:mem:relay;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# tests trigger delivery attempts directly; keep the real scheduler from also firing mid-test
relay.worker.poll-interval-ms=3600000

spring.data.redis.host=localhost
spring.data.redis.port=6379

relay.streams.delivery-stream-key=relay:deliveries:test
relay.streams.consumer-group=relay-workers-test

relay.docs-url=http://localhost:3001
relay.dashboard-url=http://localhost:3000

management.endpoints.web.exposure.include=health,info,prometheus
